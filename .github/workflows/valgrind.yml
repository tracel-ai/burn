name: valgrind

on:
  schedule:
    - cron: '0 23 * * WED' # Run every Wednesday at 23:00 (UTC)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  valgrind:
    runs-on: [
      '@id:burn-linux-valgrind-${{ github.run_id }}-${{ github.run_attempt }}',
      '@image-family:ubuntu-2404-lts-amd64',
      '@image-project:ubuntu-os-cloud',
      '@disk-size:100',
      '@keep-alive:false',
      '@machine-type:n2-standard-16',
      '@os:linux',
      '@zones:northamerica-northeast1-b'
      ]
    steps:
      - name: checkout
        uses: actions/checkout@v7
      # --------------------------------------------------------------------------------
      - name: Install Rust
        uses: tracel-ai/github-actions/install-rust@v12
        with:
          rust-toolchain: stable
          enable-cache: false
      # --------------------------------------------------------------------------------
      - name: Install Mesa
        uses: tracel-ai/github-actions/install-mesa@v12
      # --------------------------------------------------------------------------------
      - name: Install valgrind
        run: |
          sudo apt-get install -y valgrind
      # --------------------------------------------------------------------------------
      - name: Run cargo-valgrind
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "valgrind -s --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite --error-exitcode=1"
        # Looking for vulnerabilities
        run: |
          cargo test --no-fail-fast -p burn-std -p burn-tensor -p burn-backend -p burn-flex
          cargo test --no-fail-fast -p burn-backend-tests --no-default-features --features flex,std
