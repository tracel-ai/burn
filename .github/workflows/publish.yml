name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run-only:
        description: "Run xtask publish in dry-run mode (no publish)"
        type: boolean
        required: false
        default: false

jobs:
  publish-burn-rl:
    needs:
      - publish-burn-core
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-rl
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-vision:
    needs:
      - publish-burn-fusion
      - publish-burn-cubecl
      - publish-burn-core
      - publish-burn-store
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-vision
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-linalg:
    needs:
      - publish-burn-core
      - publish-burn-cubecl
      - publish-burn-fusion
      - publish-burn-router
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-linalg
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-signal:
    needs:
      - publish-burn-core
      - publish-burn-cubecl
      - publish-burn-fusion
      - publish-burn-router
      - publish-burn-autodiff
      - publish-burn-flex
      - publish-burn-tch
      - publish-burn-remote
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-signal
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-router:
    needs:
      - publish-burn-ir
      - publish-burn-std
      - publish-burn-backend
      - publish-burn-fusion
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-router
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-capture:
    needs:
      - publish-burn-backend
      - publish-burn-ir
      - publish-burn-router
      - publish-burn-std
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-capture
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-remote:
    needs:
      - publish-burn-ir
      - publish-burn-std
      - publish-burn-backend
      - publish-burn-fusion
      - publish-burn-router
      - publish-burn-communication
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-remote
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-derive:
    needs:
      - publish-burn-einsum
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-derive
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-einsum:
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-einsum
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-dataset:
    needs:
      - publish-burn-std
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-dataset
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-std:
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-std
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-backend-extension:
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-backend-extension
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-tensor:
    needs:
      - publish-burn-std
      - publish-burn-derive
      - publish-burn-einsum
      - publish-burn-backend
      - publish-burn-dispatch
      - publish-burn-backend-extension
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-tensor
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-backend:
    needs:
      - publish-burn-std
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-backend
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-ir:
    needs:
      - publish-burn-backend
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-ir
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-fusion:
    needs:
      - publish-burn-ir
      - publish-burn-backend
      - publish-burn-std
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-fusion
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-cubecl-fusion:
    needs:
      - publish-burn-ir
      - publish-burn-std
      - publish-burn-fusion
      - publish-burn-backend
    runs-on: ubuntu-latest
    env:
      CRATE: burn-cubecl-fusion
      PUBLISH_FEATURES: cubecl/wgpu
    # The shared publisher has no feature argument. Verify with a concrete
    # runtime here, without adding one to either crate's default features.
    steps: &publish-with-runtime
      - name: checkout
        uses: actions/checkout@v6
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: validate version and check registry
        id: version
        shell: bash
        run: |
          package_id=$(cargo pkgid -p "$CRATE")
          version=${package_id##*#}
          version=${version##*@}
          tag_version=${GITHUB_REF_NAME#v}
          if [[ "$version" != "$tag_version" ]]; then
            echo "::error::Tag version ($tag_version) does not match $CRATE ($version)."
            exit 1
          fi

          status=$(curl --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/published-version.json" --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/$CRATE/$version")
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Registry lookup failed with HTTP $status."; exit 1 ;;
          esac
      - name: verify package
        if: steps.version.outputs.published != 'true'
        run: cargo publish -p "$CRATE" --features "$PUBLISH_FEATURES" --dry-run
      - name: publish to crates.io
        if: steps.version.outputs.published != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry-run-only)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: cargo publish -p "$CRATE" --features "$PUBLISH_FEATURES"

  publish-burn-cubecl:
    needs:
      - publish-burn-ir
      - publish-burn-std
      - publish-burn-fusion
      - publish-burn-cubecl-fusion
      - publish-burn-backend
    runs-on: ubuntu-latest
    env:
      CRATE: burn-cubecl
      PUBLISH_FEATURES: wgpu
    steps: *publish-with-runtime

  publish-burn-autodiff:
    needs:
      - publish-burn-backend
      - publish-burn-std
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-autodiff
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-tch:
    needs:
      - publish-burn-backend
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-tch
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-ndarray:
    needs:
      - publish-burn-ir
      - publish-burn-backend
      - publish-burn-std
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-ndarray
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-flex:
    needs:
      - publish-burn-backend
      - publish-burn-ir
      - publish-burn-std
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-flex
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-wgpu:
    needs:
      - publish-burn-backend
      - publish-burn-fusion
      - publish-burn-cubecl
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-wgpu
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-cpu:
    needs:
      - publish-burn-backend
      - publish-burn-fusion
      - publish-burn-cubecl
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-cpu
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-cuda:
    needs:
      - publish-burn-backend
      - publish-burn-fusion
      - publish-burn-cubecl
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-cuda
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-rocm:
    needs:
      - publish-burn-backend
      - publish-burn-fusion
      - publish-burn-cubecl
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-rocm
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-pack:
    needs:
      - publish-burn-std
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-pack
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-communication:
    needs:
      - publish-burn-std
      - publish-burn-backend
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-communication
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-core:
    needs:
      - publish-burn-dataset
      - publish-burn-std
      - publish-burn-derive
      - publish-burn-tensor
      - publish-burn-pack
      - publish-burn-ir
      - publish-burn-dispatch
      - publish-burn-backend-extension
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-core
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-nn:
    needs:
      - publish-burn-core
      - publish-burn-linalg
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-nn
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-optim:
    needs:
      - publish-burn-core
      - publish-burn-derive
      - publish-burn-pack
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-optim
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
