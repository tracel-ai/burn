      - publish-burn-core
      - publish-burn-optim
      - publish-burn-rl
      - publish-burn-nn
      - publish-burn-store
      - publish-burn-std
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-train
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn-dispatch:
    needs:
      - publish-burn-std
      - publish-burn-backend
      - publish-burn-backend-extension
      - publish-burn-autodiff
      - publish-burn-cpu
      - publish-burn-cuda
      - publish-burn-rocm
      - publish-burn-wgpu
      - publish-burn-flex
      - publish-burn-ndarray
      - publish-burn-tch
      - publish-burn-remote
      - publish-burn-capture
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: burn-dispatch
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-burn:
    needs:
      - publish-burn-core
      - publish-burn-nn
      - publish-burn-optim
      - publish-burn-store
      - publish-burn-train
      - publish-burn-cpu
      - publish-burn-dispatch
      - publish-burn-flex
      - publish-burn-vision
