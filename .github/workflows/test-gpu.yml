name: CI GPU

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Number of the pull request that triggers this run if any"
        type: number
        required: false

# important to set the run name to this format so that the CI server
# can track the PR number from the workflow_run events.
run-name: ${{ github.workflow }}:${{ github.repository }}#${{ inputs.pr_number }}

env:
  # Note: It is not possible to define top level env vars and pass them to composite actions.
  # To work around this issue we use inputs and define all the env vars here.

  RUST_PREVIOUS_VERSION: 1.92.0

  # Dependency versioning
  # from wgpu repo: https://github.com/gfx-rs/wgpu/blob/trunk/.github/workflows/ci.yml

  # GCP runners
  # GPU jobs have a two-hour timeout and a three-hour runner lifetime.
  # Snowpiercer starts the lifetime at queued-job intake; the extra hour covers
  # capacity fallback, VM provisioning, and runner bootstrap before the job starts.
  GCP_RUNNERS_IMAGE_FAMILY: "tracel-ci-ubuntu-2404-amd64-nvidia"
  GCP_RUNNERS_MACHINE_TYPE: "g2-standard-4"
  # All G2/L4 zones, checked against the Snowpiercer GPU pool allowlist.
  # Source: https://docs.cloud.google.com/compute/docs/regions-zones/gpu-regions-zones
  # Try North America first, then Europe, the Middle East, and Asia-Pacific.
  # Snowpiercer tries these zones in order and restarts the list on each retry.
  # Split the list across @zones labels to stay below GitHub's 256-character limit.
  # Snowpiercer must support combining repeated @zones labels in workflow order.
  # Use semicolons: commas would split @zones into separate GitHub runner labels.
  # Folded YAML adds spaces between lines; Snowpiercer trims each zone.
  GCP_RUNNERS_ZONES_NA_EAST: >-
    us-east1-c;us-east1-b;
    us-east4-a;us-east4-c;
    northamerica-northeast1-b;northamerica-northeast1-c;
    northamerica-northeast2-a;northamerica-northeast2-b
  GCP_RUNNERS_ZONES_NA_WEST: >-
    us-central1-a;us-central1-b;us-central1-c;
    us-west1-a;us-west1-b;
    us-west4-a;us-west4-c
  GCP_RUNNERS_ZONES_EUROPE: >-
    europe-west2-a;europe-west2-b;
    europe-west1-b;europe-west1-c;
    europe-west4-a;europe-west4-b;europe-west4-c;
    europe-west3-a;europe-west3-b;
    europe-west6-b;europe-west6-c
  GCP_RUNNERS_ZONES_MIDDLE_EAST: "me-central2-a;me-central2-c"
  GCP_RUNNERS_ZONES_APAC: >-
    asia-northeast1-a;asia-northeast1-b;asia-northeast1-c;
    asia-northeast3-a;asia-northeast3-b;
    asia-south1-a;asia-south1-b;asia-south1-c;
    asia-east1-a;asia-east1-b;asia-east1-c;
    asia-southeast1-a;asia-southeast1-b;asia-southeast1-c

  # Test in release mode (make it an empty string to test in debug mode)
  TEST_RELEASE_FLAG: "--release"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-checks:
    runs-on: ubuntu-latest
    outputs:
      rust-prev-version: ${{ env.RUST_PREVIOUS_VERSION }}
      gcp_runners_image_family: ${{ env.GCP_RUNNERS_IMAGE_FAMILY }}
      gcp_runners_machine_type: ${{ env.GCP_RUNNERS_MACHINE_TYPE }}
      gcp_runners_zones_na_east: ${{ env.GCP_RUNNERS_ZONES_NA_EAST }}
      gcp_runners_zones_na_west: ${{ env.GCP_RUNNERS_ZONES_NA_WEST }}
      gcp_runners_zones_europe: ${{ env.GCP_RUNNERS_ZONES_EUROPE }}
      gcp_runners_zones_middle_east: ${{ env.GCP_RUNNERS_ZONES_MIDDLE_EAST }}
      gcp_runners_zones_apac: ${{ env.GCP_RUNNERS_ZONES_APAC }}
    steps:
      - name: Do Nothing
        if: false
        run: echo

  linux-std-cuda-tests:
    needs: [prepare-checks]
    timeout-minutes: 120
    # '@id:' label must be unique within this worklow
    runs-on:
      [
        "@id:burn-cuda-job-${{github.run_id}}-${{github.run_attempt}}",
        "@max-lifetime-secs:10800",
        "@pr_number:${{ inputs.pr_number }}",
        "@organization:tracel-ai",
        "@repository:burn",
        "@image-family:${{ needs.prepare-checks.outputs.gcp_runners_image_family }}",
        "@machine-type:${{ needs.prepare-checks.outputs.gcp_runners_machine_type }}",
        "@zones:${{ needs.prepare-checks.outputs.gcp_runners_zones_na_east }}",
        "@zones:${{ needs.prepare-checks.outputs.gcp_runners_zones_na_west }}",
        "@zones:${{ needs.prepare-checks.outputs.gcp_runners_zones_europe }}",
        "@zones:${{ needs.prepare-checks.outputs.gcp_runners_zones_middle_east }}",
        "@zones:${{ needs.prepare-checks.outputs.gcp_runners_zones_apac }}",
        "@gpu:true",
      ]
    env:
      LD_LIBRARY_PATH: "/usr/local/cuda/lib64"
      # disable incremental compilation (reduces artifact size)
      CARGO_PROFILE_TEST_INCREMENTAL: "false"
    # Keep the stragegy to be able to easily add new rust versions if required
    strategy:
      matrix:
        rust: [stable]
        include:
          - rust: stable
            toolchain: stable
    steps:
      - name: checkout
        uses: actions/checkout@v7
      # --------------------------------------------------------------------------------
      - name: Install Rust
        uses: tracel-ai/github-actions/install-rust@v12
        with:
          rust-toolchain: ${{ matrix.toolchain }}
          enable-cache: false
      # --------------------------------------------------------------------------------
      - name: Tests (burn-cuda)
        run: cargo xtask test ${{ env.TEST_RELEASE_FLAG }} --ci gcp-cuda-runner

  linux-std-vulkan-tests:
    needs: [prepare-checks]
    timeout-minutes: 120
    # '@id:' label must be unique within this worklow
    runs-on:
      [
        "@id:burn-vulkan-job-${{github.run_id}}-${{github.run_attempt}}",
        "@max-lifetime-secs:10800",
        "@pr_number:${{ inputs.pr_number }}",
        "@organization:tracel-ai",
        "@repository:burn",
        "@image-family:${{ needs.prepare-checks.outputs.gcp_runners_image_family }}",
        "@machine-type:${{ needs.prepare-checks.outputs.gcp_runners_machine_type }}",
        "@zones:${{ needs.prepare-checks.outputs.gcp_runners_zones_na_east }}",
        "@zones:${{ needs.prepare-checks.outputs.gcp_runners_zones_na_west }}",
        "@zones:${{ needs.prepare-checks.outputs.gcp_runners_zones_europe }}",
        "@zones:${{ needs.prepare-checks.outputs.gcp_runners_zones_middle_east }}",
        "@zones:${{ needs.prepare-checks.outputs.gcp_runners_zones_apac }}",
        "@gpu:true",
      ]
    env:
      # disable incremental compilation (reduces artifact size)
      CARGO_PROFILE_TEST_INCREMENTAL: "false"
    # Keep the stragegy to be able to easily add new rust versions if required
    strategy:
      matrix:
        rust: [stable]
        include:
          - rust: stable
            toolchain: stable
    steps:
      - name: checkout
        uses: actions/checkout@v7
      # --------------------------------------------------------------------------------
      - name: Setup Rust
        uses: tracel-ai/github-actions/install-rust@v12
        with:
          rust-toolchain: ${{ matrix.toolchain }}
          enable-cache: false
      # --------------------------------------------------------------------------------
      - name: Tests (burn-vulkan)
        run: cargo xtask test ${{ env.TEST_RELEASE_FLAG }} --ci gcp-vulkan-runner

  linux-std-wgpu-tests:
    needs: [prepare-checks]
    timeout-minutes: 120
    # '@id:' label must be unique within this worklow
    runs-on:
      [
        "@id:burn-wgpu-job-${{github.run_id}}-${{github.run_attempt}}",
        "@max-lifetime-secs:10800",
        "@pr_number:${{ inputs.pr_number }}",
        "@organization:tracel-ai",
        "@repository:burn",
        "@image-family:${{ needs.prepare-checks.outputs.gcp_runners_image_family }}",
        "@machine-type:${{ needs.prepare-checks.outputs.gcp_runners_machine_type }}",
        "@zones:${{ needs.prepare-checks.outputs.gcp_runners_zones_na_east }}",
        "@zones:${{ needs.prepare-checks.outputs.gcp_runners_zones_na_west }}",
        "@zones:${{ needs.prepare-checks.outputs.gcp_runners_zones_europe }}",
        "@zones:${{ needs.prepare-checks.outputs.gcp_runners_zones_middle_east }}",
        "@zones:${{ needs.prepare-checks.outputs.gcp_runners_zones_apac }}",
        "@gpu:true",
      ]
    env:
      # disable incremental compilation (reduces artifact size)
      CARGO_PROFILE_TEST_INCREMENTAL: "false"
    # Keep the stragegy to be able to easily add new rust versions if required
    strategy:
      matrix:
        rust: [stable]
        include:
          - rust: stable
            toolchain: stable
    steps:
      - name: checkout
        uses: actions/checkout@v7
      # --------------------------------------------------------------------------------
      - name: Setup Rust
        uses: tracel-ai/github-actions/install-rust@v12
        with:
          rust-toolchain: ${{ matrix.toolchain }}
          enable-cache: false
      # --------------------------------------------------------------------------------
      - name: Tests (burn-wgpu)
        run: cargo xtask test ${{ env.TEST_RELEASE_FLAG }} --ci gcp-wgpu-runner
