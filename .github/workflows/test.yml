name: CI

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "**.rs"
      - "**.sh"
      - "**.ps1"
      - "**.yml"
      - "**.toml"
      - "!**.md"
      - "!LICENSE-APACHE"
      - "!LICENSE-MIT"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "**.rs"
      - "**.sh"
      - "**.ps1"
      - "**.yml"
      - "**.toml"
      - "!**.md"
      - "!LICENSE-APACHE"
      - "!LICENSE-MIT"

env:
  # Note: It is not possible to define top level env vars and pass them to composite actions.
  # To work around this issue we use inputs and define all the env vars here.

  RUST_PREVIOUS_VERSION: 1.95.0

  # Dependency versioning
  # from wgpu repo: https://github.com/gfx-rs/wgpu/blob/trunk/.github/workflows/ci.yml

  # Mozilla Grcov
  GRCOV_LINK: "https://github.com/mozilla/grcov/releases/download"
  GRCOV_VERSION: "0.8.19"

concurrency:
  # A merged PR's ref becomes main; retain its PR group so closing it cancels
  # the remaining PR jobs without interrupting main's cache-producing run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare-checks:
    # Closing a PR only cancels its previous run. All other jobs depend on this one.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      rust-prev-version: ${{ env.RUST_PREVIOUS_VERSION }}
    steps:
      - name: Do Nothing
        if: false
        run: echo

  code-quality:
    runs-on: ubuntu-22.04
    needs: prepare-checks
    steps:
      - name: checkout
        uses: actions/checkout@v7
      # --------------------------------------------------------------------------------
      - name: Setup Rust
        uses: tracel-ai/github-actions/install-rust@v12
        with:
          rust-toolchain: stable
          cache-key: stable-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --------------------------------------------------------------------------------
      - name: Audit
        run: cargo xtask check audit
      # --------------------------------------------------------------------------------
      - name: Format
        shell: bash
        env:
          # work around for colors
          # see: https://github.com/rust-lang/rustfmt/issues/3385
          TERM: xterm-256color
        run: cargo xtask check format
      # --------------------------------------------------------------------------------
      - name: Lint
        # Cover opt-in backend instrumentation; regular tests exercise tracing-disabled builds.
        run: cargo xtask check --features burn/tracing lint
      # --------------------------------------------------------------------------------
      - name: Typos
        uses: tracel-ai/github-actions/check-typos@v12

  documentation:
    runs-on: ubuntu-22.04
    needs: prepare-checks
    steps:
      - name: checkout
        uses: actions/checkout@v7
      # --------------------------------------------------------------------------------
      - name: Setup Rust
        uses: tracel-ai/github-actions/install-rust@v12
        with:
          rust-toolchain: stable
          cache-key: stable-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --------------------------------------------------------------------------------
      - name: Documentation Build
        run: cargo xtask doc build
      # --------------------------------------------------------------------------------
      - name: Documentation Tests
        run: cargo xtask doc tests

  linux-std-tests:
    runs-on: ubuntu-22.04
    needs: [prepare-checks, code-quality]
    env:
      DISABLE_WGPU_SPIRV: "1"
      CARGO_TERM_COLOR: always
      COLLECT_COVERAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.ci_type != 'examples' }}
    strategy:
      matrix:
        ci_type: [backends, crates, crates-features, examples]
    steps:
      - name: checkout
        uses: actions/checkout@v7
      # --------------------------------------------------------------------------------
      - name: Setup Rust
        uses: tracel-ai/github-actions/install-rust@v12
        with:
          rust-toolchain: stable
          # Keep caches isolated per shard to prevent race conditions or bloated sizes
          cache-key: stable-${{ matrix.ci_type }}-linux-normal-tests
          save-if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
          # Instrumented main builds can exhaust disk space; cache ordinary PR builds.
          enable-cache: ${{ env.COLLECT_COVERAGE != 'true' }}
      # # --------------------------------------------------------------------------------
      - name: Install grcov
        if: env.COLLECT_COVERAGE == 'true'
        shell: bash
        run: |
          curl -L "$GRCOV_LINK/v$GRCOV_VERSION/grcov-x86_64-unknown-linux-musl.tar.bz2" |
          tar xj -C $HOME/.cargo/bin
          cargo xtask coverage install
      # --------------------------------------------------------------------------------
      - name: Tests
        run: cargo xtask ${{ env.COLLECT_COVERAGE == 'true' && '--enable-coverage' || '' }} test --ci ${{ matrix.ci_type }}
      # --------------------------------------------------------------------------------
      - name: Generate lcov.info
        if: env.COLLECT_COVERAGE == 'true'
        shell: bash
        run: |
          # Killed remote-test children leave empty profiles that llvm-profdata cannot merge.
          find . -type f -name 'burn-*.profraw' -empty -delete
          cargo xtask coverage generate --ignore "/*,xtask/*,examples/*" --profile debug
          # grcov can exit successfully even when profile merging fails.
          if ! grep -q '^SF:crates/' lcov.info; then
            echo '::error::Coverage report contains no workspace crate sources.'
            exit 1
          fi
      # --------------------------------------------------------------------------------
      - name: Upload Codecov Shard Artifact
        if: env.COLLECT_COVERAGE == 'true'
        uses: actions/upload-artifact@v7
        with:
          # Names must be unique so they don't overwrite each other in the storage backend
          name: coverage-linux-${{ matrix.ci_type }}
          path: lcov.info
          if-no-files-found: error

  linux-prev-checks:
    runs-on: ubuntu-22.04
    needs: [prepare-checks, code-quality]
    env:
      DISABLE_WGPU_SPIRV: "1"
      CARGO_TERM_COLOR: always
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: tracel-ai/github-actions/install-rust@v12
        with:
          rust-toolchain: ${{ needs.prepare-checks.outputs.rust-prev-version }}
          cache-key: prev-compatibility-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check workspace crates and examples
        # Match the portable workspace build's exclusions for CUDA and ROCm SDKs.
        run: cargo xtask compile --exclude burn-cuda,burn-rocm
      - name: Check backend-free Burn
        # Resolve independently so workspace features cannot supply a backend.
        run: cargo check -p burn
      - name: Check opt-in features
        run: cargo check -p burn --features flex,capture,train,linalg,signal,vision,rl
      - name: Check dataset all features
        run: cargo check -p burn-dataset --all-features
      - name: Build no-std crates
        run: cargo xtask --context no-std build --ci

# --- Dedicated coverage upload job ---
  upload-coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: linux-std-tests
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Download All Coverage Artifacts
        uses: actions/download-artifact@v8
        with:
          # Finds all artifacts prefixed with coverage-linux-*
          pattern: coverage-linux-*
          path: coverage-reports

      - name: Codecov upload
        uses: codecov/codecov-action@v7
        with:
          # Codecov automatically discovers and merges multiple lcov files inside this directory
          directory: coverage-reports
          token: ${{ secrets.CODECOV_TOKEN }}

  linux-no-std-tests:
    runs-on: ubuntu-22.04
    needs: [prepare-checks, code-quality]
    steps:
      - name: checkout
        uses: actions/checkout@v7
      # --------------------------------------------------------------------------------
      - name: Setup Rust
        uses: tracel-ai/github-actions/install-rust@v12
        with:
          rust-toolchain: stable
          cache-key: stable-linux-no-std-normal-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --------------------------------------------------------------------------------
      - name: Crates Build
        run: cargo xtask --context no-std build --ci
      # --------------------------------------------------------------------------------
      - name: Crates Tests
        run: cargo xtask --context no-std test --ci github-runner

  windows-std-tests:
    runs-on: windows-2022
    needs: [prepare-checks, code-quality]
    env:
      CARGO_TERM_COLOR: always
    strategy:
      matrix:
        ci_type: [backends, crates, crates-features, examples]
    steps:
      - name: checkout
        uses: actions/checkout@v7
      # --------------------------------------------------------------------------------
      - name: Setup Rust
        uses: tracel-ai/github-actions/install-rust@v12
        with:
          rust-toolchain: stable
          cache-key: stable-${{ matrix.ci_type }}-windows-normal-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --------------------------------------------------------------------------------
      - name: Tests
        run: cargo xtask test --ci ${{ matrix.ci_type }}

  macos-std-tests:
    runs-on: blaze/macos-15
    needs: [prepare-checks, code-quality]
    # On 2026-11-07 the job was still passing suites when it reached 60 minutes.
    timeout-minutes: 120
    steps:
      - name: checkout
        uses: actions/checkout@v7
      # --------------------------------------------------------------------------------
      - name: Setup Rust
        uses: tracel-ai/github-actions/install-rust@v12
        with:
          rust-toolchain: stable
          cache-key: stable-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --------------------------------------------------------------------------------
      - name: Device check
        run: system_profiler SPHardwareDataType
      # --------------------------------------------------------------------------------
      - name: Tests
        run: cargo xtask test --release --ci github-mac-runner
