[package]
name = "burn-shard"
description = "Tensors split over several devices, with the sharding rule of each op"
edition.workspace = true
license.workspace = true
version.workspace = true
repository = "https://github.com/tracel-ai/burn/tree/main/crates/burn-shard"
documentation = "https://docs.rs/burn-shard"
readme = "README.md"

[lints]
workspace = true

[features]
# Test-only: the `Tensor` tests put their members on the CUDA devices in turn, so shards cross
# devices.
test-cuda = ["burn-tensor/cuda"]
test-fusion = ["burn-tensor/fusion"]
# Test-only: the members are one CUDA and one Vulkan device, so a sharded compute device spans two runtimes.
test-mixed-runtimes = ["burn-tensor/cuda", "burn-tensor/vulkan"]

[dependencies]
burn-backend = { workspace = true, features = ["std"] }
burn-ir = { workspace = true, features = ["std"] }
burn-router = { workspace = true, features = ["std"] }
burn-std = { workspace = true, features = ["std"] }

[dev-dependencies]
burn-flex = { workspace = true, features = ["default"] }
# A path, not the workspace version: burn-tensor depends on this crate through burn-dispatch.
# Keep autotuning enabled and select fusion only through test-fusion.
burn-tensor = { path = "../burn-tensor", default-features = false, features = ["std", "flex", "autodiff", "shard", "autotune"] }
