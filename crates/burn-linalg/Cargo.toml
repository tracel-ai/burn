[package]
authors = ["laggui <lagrange.guillaume.1@gmail.com>"]
categories = ["science", "mathematics", "no-std"]
description = "Linear algebra operations for Burn tensors"
documentation = "https://docs.rs/burn-linalg"
edition.workspace = true
keywords = ["deep-learning", "machine-learning", "tensor", "linear-algebra"]
license.workspace = true
name = "burn-linalg"
readme.workspace = true
repository = "https://github.com/tracel-ai/burn/tree/main/crates/burn-linalg"
version.workspace = true

[lints]
workspace = true

[features]
default = ["burn-core/default", "flex", "cubecl-backend", "fusion", "std"]
std = ["burn-core/std", "burn-std/std", "burn-fusion?/std"]
tracing = ["burn-core/tracing", "burn-fusion?/tracing"]

cubecl-backend = ["burn-cubecl"]
fusion = ["burn-fusion", "burn-core/fusion"]

cuda = ["cubecl-backend", "burn-core/cuda"]
rocm = ["cubecl-backend", "burn-core/rocm"]
wgpu = ["cubecl-backend", "burn-core/wgpu"]
vulkan = ["cubecl-backend", "burn-core/vulkan"]
webgpu = ["cubecl-backend", "burn-core/webgpu"]
metal = ["cubecl-backend", "burn-core/metal"]
cpu = ["cubecl-backend", "burn-core/cpu"]
flex = ["burn-core/flex"]
ndarray = ["burn-core/ndarray"]
tch = ["burn-core/tch"]
remote = ["burn-core/remote", "router"]
capture = ["burn-core/capture", "router"]
router = ["burn-router"]

[dependencies]
burn-core = { workspace = true, features = ["extension"] }
burn-cubecl = { workspace = true, optional = true, default-features = false }
burn-fusion = { workspace = true, optional = true, default-features = false }
burn-router = { workspace = true, optional = true, default-features = false }
burn-std = { workspace = true }
num-traits = { workspace = true }

[package.metadata.docs.rs]
features = ["default"]
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
ctor = "0.10.1"
