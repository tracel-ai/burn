[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science", "no-std", "embedded", "wasm"]
description = "Optimizer building blocks for the Burn deep learning framework"
documentation = "https://docs.rs/burn-optim"
edition.workspace = true
keywords = ["deep-learning", "machine-learning", "tensor", "pytorch"]
license.workspace = true
name = "burn-optim"
readme = "README.md"
repository = "https://github.com/tracel-ai/burn/tree/main/crates/burn-optim"
version.workspace = true

[lints]
workspace = true

[features]
default = ["std", "burn-core/default"]
doc = [
    "std",
    # Doc features
    "burn-core/doc",
]
std = [
    "burn-core/std",
    "burn-pack/std",
    "num-traits/std",
    "serde/std",
    "log",
    "burn-cubecl?/std",
]
tracing = ["burn-core/tracing"]

# CubeCL runtimes. Each compiles the fused AdamW bridge and enables the runtime's dispatch
# backend. Without one of these features the bridge is not built and every step falls back to
# the reference implementation.
cpu = ["std", "dep:burn-cubecl", "burn-core/cpu", "burn-cubecl/cpu"]
cuda = ["std", "dep:burn-cubecl", "burn-core/cuda", "burn-cubecl/cuda"]
rocm = ["std", "dep:burn-cubecl", "burn-core/rocm", "burn-cubecl/hip"]
wgpu = ["std", "dep:burn-cubecl", "burn-core/wgpu", "burn-cubecl/wgpu"]
wgpu-msl = ["std", "dep:burn-cubecl", "burn-core/wgpu-msl", "burn-cubecl/wgpu-msl"]
vulkan = ["std", "dep:burn-cubecl", "burn-core/vulkan", "burn-cubecl/vulkan"]
webgpu = ["std", "dep:burn-cubecl", "burn-core/webgpu", "burn-cubecl/webgpu"]
metal = ["std", "dep:burn-cubecl", "burn-core/metal", "burn-cubecl/metal"]

# Public-API regression tests for AdamW's decorator fallback. Keep their runtimes opt-in.
adamw-execution-tests = [
    "cpu",
    "burn-core/shard",
    "burn-core/capture",
    "burn-core/ir",
    "burn-core/remote-server",
    "burn-core/remote-websocket",
    "dep:tokio",
]

# collective = ["burn-collective"]

[dependencies]

# ** Please make sure all dependencies support no_std when std is disabled **
burn-core = { workspace = true, features = ["autodiff", "extension"] }
burn-derive = { workspace = true }
burn-pack = { workspace = true, default-features = false }
# Default features off: they turn on kernel fusion, which would hide the raw eager fast path.
burn-cubecl = { workspace = true, optional = true, default-features = false }

num-traits = { workspace = true }
derive-new = { workspace = true }
log = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "net", "time"] }

# The same implementation of HashMap in std but with no_std support (only alloc crate is needed)
hashbrown = { workspace = true, features = ["serde"] } # no_std compatible

[dev-dependencies]
# Use path instead of workspace dep (which specifies a version, creating a circular publish dependency chain)
# Default features off so `burn-core/default` does not re-enable fusion through the dev-dependency.
burn-nn = { path = "../burn-nn", default-features = false, features = ["std"] }
divan = "0.1"

[[bench]]
name = "adamw"
path = "benches/adamw.rs"
harness = false

[package.metadata.docs.rs]
features = ["doc"]
rustdoc-args = ["--cfg", "docsrs"]
