[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science"]
description = "Backend router decorator over the network."
edition.workspace = true
keywords = ["deep-learning", "machine-learning", "data"]
license.workspace = true
name = "burn-remote"
readme = "README.md"
repository = "https://github.com/tracel-ai/burn/tree/main/crates/burn-remote"
documentation = "https://docs.rs/burn-remote"
version.workspace = true

[lints]
workspace = true

[features]
default = ["client", "server", "iroh", "websocket"]
doc = []
tracing = [
    "burn-communication?/tracing",
    "burn-ir/tracing",
    "burn-router/tracing",
    "burn-std/tracing",
    "burn-backend/tracing",
]

client = ["tokio/sync", "tokio/rt"]
# Cache recurring op-groups on the server and invoke them by id. Wraps `RemoteBackend` in `Fusion`.
fusion = ["client", "dep:burn-fusion", "burn-router/fusion"]
server = [
    "tokio/sync",
    "tokio/rt",
    "dep:tracing-subscriber",
    "dep:blake3",
    "dep:tokio-util",
]
iroh = ["dep:iroh", "tokio/io-util", "dep:tempfile"]
websocket = [
    "server",
    "dep:burn-communication",
    "burn-communication/websocket",
    "burn-communication/data-service",
    "tokio/net",
]


[dependencies]
burn-ir = { workspace = true, features = ["default"] }
burn-backend = { workspace = true, features = [
    "default",
    "serde",   # For DTypeUsageSet to be de/serialized
] }
burn-std = { workspace = true, features = ["default"] }
burn-router = { workspace = true, features = ["default"] }
burn-fusion = { workspace = true, optional = true }
# Native WebSocket transport; optional so the Iroh client stays wasm-compatible.
burn-communication = { workspace = true, optional = true }

bytes = { workspace = true }
log = { workspace = true }
rand = { workspace = true }

tokio = { workspace = true, features = ["sync", "io-util"] }
serde = { workspace = true, features = ["derive"] }
serde_bytes = { workspace = true }
rmp-serde = { workspace = true }
iroh = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }

tokio-util = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["default", "fmt", "env-filter"], optional = true }

# Native server runtime: multi-thread, timers, signals. The wasm build uses the JS event loop/timers.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "time", "signal"] }
tempfile = { workspace = true, optional = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
wasm-bindgen-futures = { workspace = true }
gloo-timers = { version = "0.4", features = ["futures"] }
futures-util = { workspace = true }

[dev-dependencies]
# Use path instead of workspace dep (which specifies a version, creating a circular publish dependency chain)
burn-flex = { path = "../burn-flex", features = ["default"] }
burn-tensor = { path = "../burn-tensor", features = ["default", "flex", "remote-server", "remote-websocket"] }
iroh-relay = { workspace = true, features = ["server"] }

[package.metadata.docs.rs]
features = ["doc"]
rustdoc-args = ["--cfg", "docsrs"]
