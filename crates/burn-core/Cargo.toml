[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science", "no-std", "embedded", "wasm"]
description = "Flexible and Comprehensive Deep Learning Framework in Rust"
documentation = "https://docs.rs/burn-core"
edition.workspace = true
keywords = ["deep-learning", "machine-learning", "tensor", "pytorch", "ndarray"]
license.workspace = true
name = "burn-core"
readme.workspace = true
repository = "https://github.com/tracel-ai/burn/tree/main/crates/burn-core"
version.workspace = true

[lints]
workspace = true

[features]
default = [
    "std",
    "burn-std/default",
    "burn-dataset?/default",
    "burn-tensor/default",
    "burn-cpu?/default",
    "burn-cuda?/default",
    "burn-rocm?/default",
    "burn-wgpu?/default",
]
doc = [
    "std",
    "dataset",
    "audio",
    # Doc features
    "burn-std/doc",
    "burn-dataset/doc",
    "burn-tensor/doc",
    "dep:regex"
]
tracing = [
    "burn-std/tracing",
    "burn-tensor/tracing",
    "burn-dataset?/tracing",
    "burn-cpu?/tracing",
    "burn-cuda?/tracing",
    "burn-rocm?/tracing",
    "burn-wgpu?/tracing",
]

dataset = ["burn-dataset"]

network = ["burn-std/network"]
sqlite = ["burn-dataset?/sqlite"]
sqlite-bundled = ["burn-dataset?/sqlite-bundled"]
std = [
    "burn-std/std",
    "burn-pack/std",
    "burn-tensor/std",
    "half/std",
    "log",
    "rand/std",
    "serde/std",
    "serde_json/std",
    "num-traits/std",
    "burn-cpu?/std",
    "burn-cuda?/std",
    "burn-rocm?/std",
    "burn-wgpu?/std",
]
vision = ["burn-dataset?/vision"]
audio = ["burn-dataset?/audio"]

# Backends
remote = ["burn-tensor/remote"]
remote-server = ["burn-tensor/remote-server"]
remote-websocket = ["burn-tensor/remote-websocket"]
cuda = ["burn-tensor/cuda", "dep:burn-cuda"]
rocm = ["burn-tensor/rocm", "dep:burn-rocm"]
flex = ["burn-tensor/flex"]
ndarray = ["burn-tensor/ndarray"]
tch = ["burn-tensor/tch"]
vulkan = ["wgpu", "burn-tensor/vulkan", "burn-wgpu/vulkan"]
webgpu = ["wgpu", "burn-tensor/webgpu", "burn-wgpu/webgpu"]
wgpu = ["burn-tensor/wgpu", "dep:burn-wgpu"]
metal = ["wgpu", "burn-tensor/metal", "burn-wgpu/metal"]
cpu = ["burn-tensor/cpu", "dep:burn-cpu"]
autodiff = ["burn-tensor/autodiff"]
capture = ["burn-tensor/capture"]
ir = ["burn-ir"]

# Backend features
autotune = [
    "burn-tensor/autotune",
    "burn-cpu?/autotune",
    "burn-cuda?/autotune",
    "burn-rocm?/autotune",
    "burn-wgpu?/autotune",
]
autotune-checks = [
    "burn-tensor/autotune-checks",
    "burn-cpu?/autotune-checks",
    "burn-cuda?/autotune-checks",
    "burn-rocm?/autotune-checks",
    "burn-wgpu?/autotune-checks",
]
fusion = [
    "burn-tensor/fusion",
    "burn-cpu?/fusion",
    "burn-cuda?/fusion",
    "burn-rocm?/fusion",
    "burn-wgpu?/fusion",
]
simd = ["burn-tensor/simd"]
rayon = ["burn-tensor/rayon"]
x86-v4 = ["burn-tensor/x86-v4"]
apple-amx = ["burn-tensor/apple-amx"]
accelerate = ["burn-tensor/accelerate"]
blas-netlib = ["burn-tensor/blas-netlib"]
openblas = ["burn-tensor/openblas"]
openblas-system = ["burn-tensor/openblas-system"]
template = ["burn-tensor/template", "burn-wgpu?/template"]

# Backend extensions
# burn-dispatch features are enabled from burn-tensor, we just re-export the public types
extension = ["burn-tensor/extension", "burn-backend-extension", "burn-dispatch", "burn-backend"]

[dependencies]

# ** Please make sure all dependencies support no_std when std is disabled **

burn-std = { workspace = true }
burn-dataset = { workspace = true, optional = true }
burn-derive = { workspace = true }
burn-pack = { workspace = true, default-features = false }
burn-tensor = { workspace = true }

# Public backend facades re-exported by `burn-core::backend`.
burn-cpu = { workspace = true, optional = true }
burn-cuda = { workspace = true, optional = true }
burn-rocm = { workspace = true, optional = true }
burn-wgpu = { workspace = true, optional = true }

# Backend extensions
burn-backend = { workspace = true, optional = true }
burn-dispatch = { workspace = true, optional = true }
burn-backend-extension = { workspace = true, optional = true }
burn-ir = { workspace = true, optional = true }

derive-new = { workspace = true }
log = { workspace = true, optional = true }
rand = { workspace = true }

# The same implementation of HashMap in std but with no_std support (only alloc crate is needed)
hashbrown = { workspace = true, features = ["serde"] } # no_std compatible

# Serialize Deserialize
serde = { workspace = true, features = ["derive"] }

half = { workspace = true }
num-traits = { workspace = true }
serde_json = { workspace = true, features = ["alloc"] } #Default enables std
spin = { workspace = true }                             # Using in place of use std::sync::Mutex when std is disabled
regex = { workspace = true, optional = true }

[target.'cfg(target_has_atomic = "ptr")'.dependencies]
regex = { workspace = true }

[dev-dependencies]
burn-dataset = { workspace = true, features = ["fake"] }
serial_test = { workspace = true }
tempfile = { workspace = true }

# Default device for tests
burn-tensor = { workspace = true, features = ["flex"] }

[package.metadata.docs.rs]
features = ["doc"]
rustdoc-args = ["--cfg", "docsrs"]
