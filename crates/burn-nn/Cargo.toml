[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science", "no-std", "embedded", "wasm"]
description = "Neural network building blocks for the Burn deep learning framework"
documentation = "https://docs.rs/burn-nn"
edition.workspace = true
keywords = ["deep-learning", "machine-learning", "tensor", "pytorch"]
license.workspace = true
name = "burn-nn"
readme = "README.md"
repository = "https://github.com/tracel-ai/burn/tree/main/crates/burn-nn"
version.workspace = true

[lints]
workspace = true

[features]
default = ["std", "burn-core/default"]
doc = [
    "std",
    # Doc features
    "burn-core/doc",
    "linalg",
]
std = ["burn-core/std", "burn-linalg?/std", "num-traits/std"]

tracing = ["burn-core/tracing", "burn-linalg?/tracing"]

# Orthogonal initialization, cosine similarity and pairwise distance modules, and cosine embedding
# and triplet margin losses.
linalg = ["dep:burn-linalg"]

[dependencies]

# ** Please make sure all dependencies support no_std when std is disabled **
burn-core = { workspace = true }
burn-linalg = { workspace = true, optional = true }

num-traits = { workspace = true }

[dev-dependencies]
# `instrument`, for the tests that read what a layer declares.
burn-core = { workspace = true, features = ["autodiff", "instrument"] }
rstest = { workspace = true }

[package.metadata.docs.rs]
features = ["doc"]
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "softmax_collapse"
harness = false
required-features = ["std", "burn-core/flex"]
