[package]
workspace = "../.."
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science"]
description = "Generic backend that can be compiled just-in-time to any shader language target"
documentation = "https://docs.rs/burn-cubecl"
edition.workspace = true
keywords = ["deep-learning", "machine-learning", "gpu"]
license.workspace = true
name = "burn-cubecl"
readme = "README.md"
repository = "https://github.com/tracel-ai/burn/tree/main/crates/burn-cubecl"
version.workspace = true

[lints]
workspace = true

[features]
default = [
    "autotune",
    "std",
    "fusion",
    "cubecl/default",
    "burn-backend/default",
    "burn-fusion?/default",
    "burn-cubecl-fusion?/default",
]
std = [
    "cubecl/std",
    "burn-backend/std",
    "burn-fusion?/std",
    "burn-cubecl-fusion?/std",
]
doc = ["default", "wgpu", "fft", "dep:branches"]
# Native FFT kernels, enabled by burn-signal.
fft = ["cubek/fft"]

# The runtime to compile against. A backend no longer carries its runtime in its type, but
# `cubecl::Device` — and through it `CubeBackend` — exists only once at least one runtime is
# compiled in, so a build of this crate has to name one. The runtime crates (`burn-cuda`,
# `burn-wgpu`, `burn-rocm`, `burn-cpu`) each turn one on for their own dependents; these are here
# so that this crate also builds, and documents, on its own. `doc` picks wgpu as the portable one.
cuda = ["cubecl/cuda", "burn-backend/cubecl-cuda"]
hip = ["cubecl/hip", "burn-backend/cubecl-hip"]
cpu = ["cubecl/cpu", "burn-backend/cubecl-cpu"]
wgpu = ["cubecl/wgpu", "burn-backend/cubecl-wgpu"]
metal = ["wgpu", "cubecl/metal", "burn-backend/cubecl-metal"]
vulkan = ["wgpu", "cubecl/vulkan", "burn-backend/cubecl-vulkan"]
webgpu = ["wgpu", "cubecl/webgpu", "burn-backend/cubecl-webgpu"]

tracing = [
    "dep:tracing",
    "cubecl/tracing",
    "burn-std/tracing",
    "burn-backend/tracing",
    "burn-fusion?/tracing",
    "burn-cubecl-fusion?/tracing",
]

# Compile persistent caches; runtime configuration controls which caches are used.
persistence = ["cubecl/persistence"]
autotune = ["burn-cubecl-fusion?/autotune"]
autotune-checks = [
    "autotune",
    "cubecl/autotune-checks",
    "burn-cubecl-fusion?/autotune-checks",
]

# Attention's backward pass through cubek's tile-DSL routines, for training: autodiff runs it
# instead of differentiating the decomposed attention, where it serves the attention.
attention-backward = ["cubek/attention-backward", "cubek/attention-tiled"]

# Autotune races only cubek's tile-DSL matmul and attention routines, never the multi-level ones
# or the old attention: an input they don't serve fails instead of falling back. For measuring
# them through burn's tests and benches, not for use.
tile-kernels-only = ["autotune", "cubek/microkernel", "cubek/attention-tiled"]

fusion = ["burn-fusion", "burn-cubecl-fusion"]
fusion-experimental = ["fusion"]

template = []


[dependencies]
branches = { workspace = true, optional = true }
burn-cubecl-fusion = { workspace = true, optional = true }
burn-fusion = { workspace = true, optional = true }
burn-ir = { workspace = true }
burn-std = { workspace = true }
burn-backend = { workspace = true, features = [
    "cubecl",
    # `CubeBackend`'s device *is* `cubecl::Device`, so it has to be a burn device.
    "cubecl-device",
] }
cubecl = { workspace = true, features = ["stdlib"] }
cubek = { workspace = true, features = [
    "attention",
    "matmul",
    "matmul-multi-level",
    "matmul-tiled",
    "convolution",
    "interpolate",
    "pool",
    "reduce",
    "random",
    "quantization",
    "stdlib",
] }
tracing = { workspace = true, features = ["attributes"], optional = true }

derive-new = { workspace = true }
log = { workspace = true }

# Async
futures-lite = { workspace = true, features = ["std"] }

# Template
serde = { workspace = true }
text_placeholder = { workspace = true, features = ["struct_context"] }

[dev-dependencies]
cubecl = { workspace = true, features = ["test-runtime"] }

[package.metadata.docs.rs]
features = ["doc"]
rustdoc-args = ["--cfg", "docsrs"]
