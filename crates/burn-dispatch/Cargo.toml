[package]
authors = [
    "laggui <lagrange.guillaume.1@gmail.com>",
    "nathanielsimard <nathaniel.simard.42@gmail.com>",
]
categories = ["science"]
description = "Backend dispatch for the Burn framework"
edition.workspace = true
keywords = ["deep-learning", "machine-learning", "data"]
license.workspace = true
name = "burn-dispatch"
readme.workspace = true
repository = "https://github.com/tracel-ai/burn/tree/main/crates/burn-dispatch"
documentation = "https://docs.rs/burn-dispatch"
version.workspace = true

[lints]
workspace = true

[features]
default = [
    "std",
    "burn-autodiff?/default",
    "burn-cpu?/default",
    "burn-cuda?/default",
    "burn-flex/default",
    "burn-ndarray?/default",
    "burn-rocm?/default",
    "burn-tch?/default",
    "burn-wgpu?/default",
]
doc = ["default"]
std = [
    "burn-backend/std",
    "burn-autodiff?/std",
    "burn-cpu?/std",
    "burn-cuda?/std",
    "burn-flex/std",
    "burn-ndarray?/std",
    "burn-rocm?/std",
    "burn-tch?/std",
    "burn-wgpu?/std",
]
tracing = [
    "burn-autodiff?/tracing",
    "burn-cpu?/tracing",
    "burn-cuda?/tracing",
    "burn-flex/tracing",
    "burn-ndarray?/tracing",
    "burn-rocm?/tracing",
    "burn-tch?/tracing",
    "burn-wgpu?/tracing",
]

# Enables cubecl-facing APIs (e.g. throughput measurement) on cubecl-backed devices.
cubecl = ["burn-backend/cubecl"]

# Backends
cuda = ["burn-cuda", "cubecl"]
flex = [] # default
rocm = ["burn-rocm", "cubecl"]
ndarray = ["burn-ndarray"]
tch = ["burn-tch"]
vulkan = ["wgpu", "burn-wgpu/vulkan"]
webgpu = ["wgpu", "burn-wgpu/webgpu"]
metal = ["wgpu", "burn-wgpu/metal"]
wgpu = ["burn-wgpu", "cubecl"]
cpu = ["burn-cpu", "cubecl"]
autodiff = ["burn-autodiff"]
# Remote compute client over Iroh.
remote = ["std", "burn-remote", "burn-remote/iroh"]
# Host a remote compute server over Iroh.
remote-server = ["remote", "burn-remote/server"]
# Add the legacy WebSocket transport.
remote-websocket = ["remote", "burn-remote/websocket"]
capture = ["burn-capture"]

# Backend features
autotune = [
    "burn-wgpu?/autotune",
    "burn-cuda?/autotune",
    "burn-rocm?/autotune",
    "burn-cpu?/autotune",
]
autotune-checks = [
    "burn-wgpu?/autotune-checks",
    "burn-cuda?/autotune-checks",
    "burn-rocm?/autotune-checks",
    "burn-cpu?/autotune-checks",
]
fusion = [
    "burn-wgpu?/fusion",
    "burn-cuda?/fusion",
    "burn-rocm?/fusion",
    "burn-cpu?/fusion",
    "burn-remote?/fusion",
]

# CPU backend codegen and threading. `burn-flex` is a non-optional dependency
# here, so these reach it without the weak `?` form (which only fires when the
# optional dependency's own feature is enabled).
simd = ["burn-flex/simd", "burn-ndarray?/simd"]
rayon = ["burn-flex/rayon", "burn-ndarray?/multi-threads"]

# Opt-in gemm codegen paths (burn-flex).
x86-v4 = ["burn-flex/x86-v4"]
apple-amx = ["burn-flex/apple-amx"]

# BLAS providers (burn-ndarray).
accelerate = ["burn-ndarray?/blas-accelerate"]
blas-netlib = ["burn-ndarray?/blas-netlib"]
openblas = ["burn-ndarray?/blas-openblas"]
openblas-system = ["burn-ndarray?/blas-openblas-system"]

template = ["burn-wgpu?/template"]

[dependencies]
burn-backend = { workspace = true }
burn-backend-extension = { workspace = true }

# Backends
burn-autodiff = { workspace = true, optional = true }
burn-cpu = { workspace = true, optional = true }
burn-cuda = { workspace = true, optional = true }
burn-flex = { workspace = true }
burn-ndarray = { workspace = true, optional = true }
burn-tch = { workspace = true, optional = true }
burn-rocm = { workspace = true, optional = true }
burn-wgpu = { workspace = true, optional = true }

burn-remote = { workspace = true, optional = true, features = ["client"] }
burn-capture = { workspace = true, optional = true }

# Op macros with `.as_$inner_kind()`
paste = { workspace = true }

[target.'cfg(not(target_has_atomic = "ptr"))'.dependencies]
burn-flex = { workspace = true, features = ["critical-section"]}

[package.metadata.docs.rs]
features = ["doc"]
rustdoc-args = ["--cfg", "docsrs"]
