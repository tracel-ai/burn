[package]
name = "adamw-foreach-decorator-checks"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[features]
remote = ["burn/remote-server", "burn/remote-websocket", "dep:tokio"]

[dependencies]
burn = { package = "burn-core", path = "../../../../../crates/burn-core", default-features = false, features = ["std", "cpu", "group", "capture"] }
burn-optim = { path = "../../../../../crates/burn-optim", default-features = false, features = ["std", "cpu"] }
burn-cubecl = { path = "../../../../../crates/burn-cubecl", default-features = false, features = ["std", "cpu"] }
burn-ir = { path = "../../../../../crates/burn-ir", default-features = false, features = ["std"] }
burn-pack = { path = "../../../../../crates/burn-pack", default-features = false, features = ["std"] }
serde_json = "1"
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "time"] }

[profile.dev]
debug = 0
strip = "none"
