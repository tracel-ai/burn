[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
edition.workspace = true
license.workspace = true
name = "mnist"
publish = false
version.workspace = true

[lints]
workspace = true

[features]
default = ["burn/default", "burn/tui"]
flex = ["burn/flex"]
tch-cpu = ["burn/tch"]
tch-gpu = ["burn/tch"]
wgpu = ["burn/wgpu"]
metal = ["burn/metal"]
cuda = ["burn/cuda"]
vulkan = ["burn/vulkan"]
rocm = ["burn/rocm"]
remote = ["burn/remote-websocket"]
# Deliberate device failures, for the `mnist-fault` example.
fault-injection = ["burn/extension", "dep:burn-cubecl", "dep:cubecl"]

[dependencies]
burn = { workspace = true, features = [
    "train",
    "vision",
    "metrics",
    "fusion",
    "flex",
] }

burn-cubecl = { workspace = true, optional = true, features = ["default"] }
cubecl = { workspace = true, optional = true }
log = { workspace = true }
rand.workspace = true

[[example]]
name = "mnist-fault"
required-features = ["fault-injection"]
