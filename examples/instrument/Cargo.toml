[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
edition.workspace = true
license.workspace = true
name = "instrument"
publish = false
version.workspace = true

[lints]
workspace = true

[features]
# The collector reads a cubecl runtime's launches, so one has to be linked; `fusion` lets it
# place kernels that carry out several components' work.
default = ["wgpu"]
cpu = ["burn/cpu"]
cuda = ["burn/cuda"]
metal = ["burn/metal"]
rocm = ["burn/rocm"]
vulkan = ["burn/vulkan"]
wgpu = ["burn/wgpu"]

[dependencies]
burn = { workspace = true, features = ["std", "fusion"] }
