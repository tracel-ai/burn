[package]
authors = ["aasheeshsingh <aasheeshdtu@gmail.com>"]
edition.workspace = true
license.workspace = true
name = "simple-regression"
publish = false
version.workspace = true

[lints]
workspace = true

[features]
default = ["burn/dataset", "burn/sqlite"]
flex = ["burn/flex"]
wgpu = ["burn/wgpu"]
remote = ["burn/remote-websocket"]

[dependencies]
burn = { workspace = true, features = ["default", "train"] }

# Serialization
log = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }

# Displaying results
textplots = "0.8.7"
rgb = "0.8.53"
