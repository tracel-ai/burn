[package]
edition.workspace = true
license.workspace = true
name = "remote-mnist"
publish = false
version.workspace = true
description = "Train and run the MNIST model on another machine's GPU through the remote backend"

[lints]
workspace = true

[dependencies]
burn = { workspace = true, features = ["remote", "remote-websocket", "fusion"] }
mnist = { path = "../mnist" }
clap = { workspace = true, features = ["env"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
