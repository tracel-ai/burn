pytorch-reader = { path = "crates/pytorch-reader", version = "0.22.0" }

### For the main burn branch. ###
cubecl = { git = "https://github.com/tracel-ai/cubecl", default-features = false, rev = "9865237018abc5ca2b30724f729e1a0790ac503d" }
cubecl-common = { git = "https://github.com/tracel-ai/cubecl", default-features = false, rev = "9865237018abc5ca2b30724f729e1a0790ac503d" }
